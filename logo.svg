<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- พื้นหลังโค้งมน สีน้ำเงินเข้ม (Dark/Slate) -->
    <rect width="200" height="200" rx="45" fill="#1e293b"/>
    
    <!-- กระดาษเอกสารสัญญา -->
    <rect x="55" y="35" width="90" height="120" rx="12" fill="#ffffff"/>
    
    <!-- เส้นบรรทัดบนเอกสาร -->
    <line x1="75" y1="65" x2="125" y2="65" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    <line x1="75" y1="85" x2="125" y2="85" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    <line x1="75" y1="105" x2="100" y2="105" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    
    <!-- เครื่องหมายติ๊กถูก (อนุมัติ) -->
    <path d="M 85 135 L 100 150 L 145 95" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- เหรียญทองทับมุมขวาล่าง -->
    <circle cx="150" cy="150" r="32" fill="#f59e0b"/>
    <text x="150" y="163" font-family="Arial" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">฿</text>
</svg>
