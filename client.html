<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ตรวจสอบข้อมูลสัญญา - ลูกค้า</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="logo1.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f8fafc;">

<div class="top-header d-flex justify-content-between align-items-center shadow-sm">
  <h5 class="fw-bold m-0 text-primary-corp"><i class="fa-solid fa-user-circle me-2"></i>ข้อมูลลูกค้า</h5>
  <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3 py-1 fw-bold shadow-sm">ออกจากระบบ</button>
</div>

<div class="loader" id="loader">
  <div class="spinner-border text-primary-corp mb-3" style="width: 3.5rem; height: 3.5rem;"></div>
  <h6 class="text-primary-corp fw-bold mt-2">กำลังโหลดข้อมูลของคุณ...</h6>
</div>

<div class="container px-3" style="max-width: 500px; padding-top: 80px; padding-bottom: 30px;">
  
  <div class="pro-card text-center p-4 mb-4 shadow-sm" style="border-top: 4px solid #2563eb; background: #ffffff; border-radius: 20px;">
    <div id="uPhotoContainer" class="mb-3 d-flex justify-content-center align-items-center mx-auto" style="width: 100px; height: 100px; border-radius: 50%; background: #f1f5f9; border: 3px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden;">
        <i class="fa-solid fa-user text-secondary" style="font-size: 3.5rem;"></i>
    </div>
    <h5 class="fw-bold text-dark mb-1" id="uName">กำลังโหลด...</h5>
    <p class="text-muted small mb-0"><i class="fa-solid fa-phone me-1"></i> <span id="uPhone">-</span></p>
  </div>

  <h6 class="fw-bold text-dark mb-3 px-2"><i class="fa-solid fa-file-contract me-2 text-primary-corp"></i> สัญญาเงินกู้ของฉัน</h6>
  <div id="uLoansContainer"></div>

  <h6 class="fw-bold text-dark mb-3 mt-4 px-2"><i class="fa-solid fa-clock-rotate-left me-2 text-success-corp"></i> ประวัติการส่งค่างวด</h6>
  <div id="uPaymentsContainer"></div>

</div>

<script src="client.js"></script>
</body>
</html>
