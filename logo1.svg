<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- พื้นหลังโค้งมน สีน้ำเงิน (Primary Corp) -->
    <rect width="200" height="200" rx="45" fill="#2563eb"/>
    
    <!-- รัศมีวงกลมด้านหลังเหรียญ -->
    <circle cx="100" cy="95" r="60" fill="#1d4ed8"/>
    
    <!-- เหรียญทอง (Warning Corp) -->
    <circle cx="100" cy="95" r="45" fill="#f59e0b"/>
    <circle cx="100" cy="95" r="35" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
    
    <!-- สัญลักษณ์เงินบาท -->
    <text x="100" y="117" font-family="'Prompt', sans-serif, Arial" font-size="60" font-weight="bold" fill="#ffffff" text-anchor="middle">฿</text>
    
    <!-- ริบบิ้น/มือรับทรัพย์ สีเขียว (Success Corp) ด้านล่าง -->
    <path d="M 40 170 Q 100 205 160 170 L 140 145 Q 100 170 60 145 Z" fill="#10b981"/>
</svg>
