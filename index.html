<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>เข้าสู่ระบบ - Fintech Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="logo1.svg" type="image/svg+xml">
  <style>
    /* 🟢 พื้นหลังแบบเคลื่อนไหว (Animated Gradient) */
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    body {
      font-family: 'Prompt', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, #0f172a, #1e3a8a, #312e81, #064e3b);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      overflow: hidden;
      position: relative;
    }

    /* 🟢 ลูกแก้วแสงลอยไปมา (Floating Orbs) */
    .shape {
      position: absolute;
      filter: blur(60px);
      z-index: 0;
      animation: floatOrb 10s infinite ease-in-out alternate;
    }
    .shape-1 { width: 350px; height: 350px; background: rgba(59, 130, 246, 0.4); top: -100px; left: -100px; border-radius: 50%; }
    .shape-2 { width: 450px; height: 450px; background: rgba(16, 185, 129, 0.3); bottom: -150px; right: -100px; border-radius: 50%; animation-delay: -5s; animation-duration: 12s; }
    .shape-3 { width: 250px; height: 250px; background: rgba(139, 92, 246, 0.3); top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; animation-delay: -2s; animation-duration: 8s;}
    
    @keyframes floatOrb { 
      0% { transform: translateY(0) translateX(0) scale(1); } 
      100% { transform: translateY(60px) translateX(40px) scale(1.1); } 
    }

    /* 🟢 การ์ดแบบกระจกฝ้า (Glassmorphism) */
    .login-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.3);
      width: 90%;
      max-width: 400px;
      padding: 40px 30px;
      text-align: center;
      position: relative;
      z-index: 1;
      /* แอนิเมชันตอนโหลดหน้าเว็บ เด้งลงมา */
      animation: dropInBounce 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes dropInBounce {
      0% { opacity: 0; transform: translateY(-80px) scale(0.8); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 🟢 แอนิเมชันตอนเปลี่ยนหน้า (3D Flip) */
    .animate-flip {
      animation: flipInY 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes flipInY {
      0% { opacity: 0; transform: perspective(800px) rotateY(90deg) scale(0.9); }
      100% { opacity: 1; transform: perspective(800px) rotateY(0deg) scale(1); }
    }

    /* 🟢 แอนิเมชันสั่นเมื่อกรอกผิด */
    .shake-animation {
      animation: shakeError 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shakeError {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }

    /* ตกแต่งปุ่มและช่องกรอก */
    .login-icon {
      font-size: 4.5rem;
      margin-bottom: 5px;
      display: inline-block;
      filter: drop-shadow(0 10px 15px rgba(37, 99, 235, 0.3));
      animation: floatIcon 3s ease-in-out infinite;
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .emoji-icon { font-style: normal; margin-right: 8px; }
    
    .form-control-custom {
      background-color: rgba(248, 250, 252, 0.8);
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 1rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    .form-control-custom:focus {
      background-color: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), 0 10px 15px -3px rgba(0,0,0,0.05);
      outline: none;
      transform: translateY(-2px);
    }
    
    .btn-main, .btn-unlock {
      color: #ffffff;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
    }
    .btn-main { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
    .btn-unlock { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    
    .btn-main:hover, .btn-unlock:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .btn-main:active, .btn-unlock:active {
      transform: translateY(1px);
    }

    /* 🟢 หน้าจอ Loader แบบล้ำๆ */
    .loader-overlay {
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(15, 23, 42, 0.85); 
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: none; 
      z-index: 9999; 
      justify-content: center; 
      align-items: center; 
      flex-direction: column;
    }
    .glowing-ring {
      width: 80px; height: 80px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-bottom-color: #10b981;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite, glow 2s ease-in-out infinite alternate;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes glow { 
      0% { box-shadow: 0 0 10px rgba(59,130,246,0.2), inset 0 0 10px rgba(59,130,246,0.2); } 
      100% { box-shadow: 0 0 30px rgba(16,185,129,0.6), inset 0 0 20px rgba(16,185,129,0.4); } 
    }

    .modal-overlay { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(15, 23, 42, 0.7); z-index: 10000; display: none; 
      align-items: center; justify-content: center; backdrop-filter: blur(8px);
    }
    .pro-card {
      background: #ffffff; border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

<!-- พื้นหลังลูกแก้วแสง -->
<div class="shape shape-1"></div>
<div class="shape shape-2"></div>
<div class="shape shape-3"></div>

<!-- แจ้งเตือน -->
<div id="customAlert" class="modal-overlay">
  <div class="pro-card p-4 text-center bg-white" style="width: 85%; max-width: 320px; border-top: 6px solid #ef4444;">
    <span style="font-size: 4rem; display: block; margin-bottom: 10px; animation: dropInBounce 0.5s;">❌</span>
    <h5 class="fw-bold mb-2 text-danger">แจ้งเตือน</h5>
    <p id="alertMsg" class="text-muted mb-4 small">เกิดข้อผิดพลาด</p>
    <button class="btn btn-danger fw-bold px-4 py-3 w-100 shadow-sm" style="border-radius: 16px;" onclick="document.getElementById('customAlert').style.display='none'">รับทราบ</button>
  </div>
</div>

<!-- โหลดข้อมูล (Sci-Fi Loader) -->
<div class="loader-overlay" id="loader">
  <div class="glowing-ring mb-4"></div>
  <h5 class="text-white fw-bold m-0" style="letter-spacing: 2px;">AUTHENTICATING</h5>
  <p class="text-white opacity-50 small mt-1">Establishing secure connection...</p>
</div>

<!-- กล่อง Login หลัก -->
<div class="login-card" id="mainCard">
  <div class="mb-4">
    <span class="login-icon">🛡️</span>
    <h3 class="fw-bold text-dark mt-2 mb-0" style="font-size: 1.8rem; letter-spacing: -0.5px;">Fintech Pro</h3>
    <p class="text-muted small mb-0 fw-bold opacity-75" style="letter-spacing: 1px;">SECURE SYSTEM</p>
  </div>

  <!-- 🟢 สถานะที่ 1: แตะ Tag NFC -->
  <div id="stepEnterPin" style="display: none;">
    <div class="mb-4">
      <h6 class="fw-bold text-success mb-2"><span class="emoji-icon">✅</span>ยืนยันตัวตนพนักงาน</h6>
      <div class="badge bg-dark px-4 py-2 fs-6 rounded-pill shadow-sm" id="displayUid" style="letter-spacing: 2px;">ID</div>
    </div>
    
    <div class="mb-4 text-start">
      <label class="text-muted fw-bold small mb-2 text-center w-100"><span class="emoji-icon">🔑</span>กรอกรหัส PIN 4 หลัก</label>
      <input type="password" id="nfcPin" class="form-control-custom w-100 text-center fw-bold" style="font-size: 2.5rem; letter-spacing: 20px; color: #0f172a;" maxlength="4" placeholder="••••" oninput="this.value=this.value.replace(/[^0-9]/g,'')" onkeypress="if(event.key==='Enter') submitNfcLogin()">
    </div>
    
    <button class="btn-main w-100 mb-2" onclick="submitNfcLogin()">เข้าสู่ระบบทันที</button>
  </div>

  <!-- 🟢 สถานะที่ 2: ระบบถูกล็อค (Gateway Lock) -->
  <div id="stepGatewayLock" style="display: none;">
    <div class="p-4 rounded-4 mb-4" style="background: rgba(241, 245, 249, 0.7); border: 2px dashed #cbd5e1;">
        <span style="font-size: 3.5rem; display:block; margin-bottom: 5px;">🔒</span>
        <h6 class="fw-bold mt-2 text-danger m-0">พื้นที่จำกัดสิทธิ์</h6>
        <p class="text-muted small m-0 mt-2">กรุณากรอก PIN ปลดล็อคระบบ</p>
    </div>
    <div class="mb-4">
        <input type="password" id="gatewayPin" class="form-control-custom w-100 text-center fw-bold text-danger" style="font-size: 2.5rem; letter-spacing: 20px; background-color: rgba(254, 226, 226, 0.5);" maxlength="4" placeholder="••••" oninput="this.value=this.value.replace(/[^0-9]/g,'')" onkeypress="if(event.key==='Enter') unlockGateway()">
    </div>
    <button class="btn-unlock w-100" onclick="unlockGateway()">ปลดล็อคหน้าจอ</button>
  </div>

  <!-- 🟢 สถานะที่ 3: ฟอร์ม Login ปกติ -->
  <div id="stepManualLogin" style="display: none;">
    <form onsubmit="event.preventDefault(); submitLogin();" class="text-start">
      <div class="mb-3">
        <label class="fw-bold text-dark mb-2" style="font-size: 0.9rem;"><span class="emoji-icon">👤</span>รหัสผู้ใช้งาน (ID)</label>
        <input type="text" id="userId" class="form-control-custom w-100" placeholder="ระบุรหัสพนักงาน" required autocomplete="username">
      </div>
      
      <div class="mb-4">
        <label class="fw-bold text-dark mb-2" style="font-size: 0.9rem;"><span class="emoji-icon">🔑</span>รหัสผ่าน</label>
        <input type="password" id="password" class="form-control-custom w-100" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-main w-100 mb-2">
        ลงชื่อเข้าใช้
      </button>
    </form>
  </div>

</div>

<script src="index.js"></script>
</body>
</html>
