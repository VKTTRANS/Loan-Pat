<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>เข้าสู่ระบบ - Fintech Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="logo1.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      text-align: center;
    }
    .login-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
      display: inline-block;
    }
    .emoji-icon {
      font-style: normal;
      margin-right: 8px;
    }
  </style>
</head>
<body>

<div id="customAlert" class="modal-overlay" style="z-index: 99999; align-items: center;">
  <div class="pro-card p-4 text-center" style="width: 85%; max-width: 320px; border-top: 5px solid #ef4444; border-radius: 20px; background: #fff;">
    <span style="font-size: 3.5rem; display: block; margin-bottom: 15px;">❌</span>
    <h5 class="fw-bold mb-2 text-danger-corp">แจ้งเตือน</h5>
    <p id="alertMsg" class="text-muted mb-4 small">เกิดข้อผิดพลาด</p>
    <button class="btn btn-danger fw-bold px-4 py-3 w-100 rounded-pill shadow-sm" onclick="document.getElementById('customAlert').style.display='none'">ตกลง</button>
  </div>
</div>

<div class="loader" id="loader">
  <div class="spinner-border text-primary-corp mb-3" style="width: 3.5rem; height: 3.5rem;"></div>
  <h6 class="text-primary-corp fw-bold mt-2">กำลังเข้าสู่ระบบ...</h6>
</div>

<div class="login-card">
  <span class="login-icon">🛡️</span>
  <h3 class="fw-bold text-dark mb-1">Fintech Pro</h3>
  <p class="text-muted small mb-4">ระบบบริหารจัดการสินเชื่อครบวงจร</p>

  <!-- ใช้ tag form และ onsubmit="return false;" เพื่อดักการกระพริบ 100% -->
  <form onsubmit="event.preventDefault(); submitLogin();" class="text-start">
    <div class="mb-3">
      <label class="fw-bold small text-muted mb-1"><span class="emoji-icon">👤</span>รหัสผู้ใช้งาน (ID)</label>
      <input type="text" id="userId" class="form-control form-control-lg bg-light" placeholder="ระบุรหัสผู้ใช้งาน" required autocomplete="username">
    </div>
    
    <div class="mb-4">
      <label class="fw-bold small text-muted mb-1"><span class="emoji-icon">🔒</span>รหัสผ่าน</label>
      <input type="password" id="password" class="form-control form-control-lg bg-light" placeholder="••••••••" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn bg-primary-corp text-white fw-bold py-3 w-100 rounded-pill shadow-sm fs-5 mb-3">
      เข้าสู่ระบบ
    </button>
  </form>

  <div class="position-relative text-center my-3">
    <hr class="text-muted opacity-25">
    <span class="bg-white px-3 text-muted small position-absolute top-50 start-50 translate-middle">หรือ</span>
  </div>

  <button onclick="openNfcLogin()" class="btn btn-outline-dark fw-bold py-3 w-100 rounded-pill shadow-sm">
    <span class="emoji-icon">📱</span> เข้าสู่ระบบด้วย NFC
  </button>
</div>

<!-- Modal NFC Login -->
<div id="modalNfc" class="modal-overlay" style="z-index: 1000; align-items: center;">
  <div class="pro-card p-4 text-center bg-white" style="width: 85%; max-width: 340px; border-top: 5px solid #10b981; border-radius: 20px;">
    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
      <h5 class="fw-bold m-0 text-success-corp"><span class="emoji-icon">📱</span> แตะบัตร NFC</h5>
      <span class="fs-4 text-secondary p-2" onclick="closeNfcModal()" style="cursor:pointer">❌</span>
    </div>
    
    <p class="text-muted small mb-3">แตะบัตรพนักงานของคุณที่หลังโทรศัพท์เพื่ออ่านรหัส ID อัตโนมัติ</p>
    
    <input type="text" id="nfcId" class="form-control form-control-lg text-center mb-3 bg-light fw-bold" placeholder="รอการแตะบัตร..." readonly>
    
    <div id="nfcPinSection" style="display: none;">
      <label class="fw-bold text-dark small mb-1">กรอก PIN 4 หลัก</label>
      <input type="password" id="nfcPin" class="form-control form-control-lg text-center fw-bold mb-4 fs-3" maxlength="4" placeholder="••••" oninput="this.value=this.value.replace(/[^0-9]/g,'')" onkeypress="handleNfcEnter(event)">
      <button class="btn bg-success-corp text-white fw-bold py-3 w-100 rounded-pill shadow-sm" onclick="submitNfcLogin()">ยืนยัน PIN</button>
    </div>
    
    <button id="btnReadNfc" class="btn btn-dark fw-bold py-3 w-100 rounded-pill shadow-sm mt-2" onclick="startNfcRead()">เริ่มอ่านบัตร NFC</button>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
